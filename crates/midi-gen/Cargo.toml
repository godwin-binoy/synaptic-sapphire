[package]
name = "midi-gen"
description = "Algorithmic, deterministic MIDI composition engine for ambient/lofi music generation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "midi_gen"
path = "src/lib.rs"

[[bin]]
name = "midi-gen"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5.61", features = ["derive"] }
midly.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tinyaudio.workspace = true

[dev-dependencies]
